name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ui

      - name: Typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Test
        run: npm test
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

      # ui/dist/index.mjs is a deployment contract: it is committed so the work
      # machine needs no Node/npm. This step fails if UI source was edited
      # without rebuilding the artifact.
      - name: Verify artifact in sync
        run: git diff --exit-code ui/dist/index.mjs
        working-directory: ${{ github.workspace }} # must run from repo root for the path to resolve

  skill-router:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Skill routing regression
        run: node experiments/skill-router/router.mjs benchmark
